name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out pinned source and fixtures
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive
          persist-credentials: false
      - name: Verify pinned SkillJect corpus
        run: scripts/verify-skillject.sh
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Test workspace
        run: cargo test --workspace --locked
      - name: Test egress interception policy
        working-directory: containers
        run: python3 -m unittest -v test_egress_policy.py
      - name: Check telemetry viewer JavaScript
        run: node --check crates/skill-telemetry-view/web/app.js
      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Validate worker CLIs
        run: |
          cargo run --quiet --locked -p skill-ingest -- --help >/dev/null
          cargo run --quiet --locked -p skill-detonate --bin skill-detonate -- --help >/dev/null
          cargo run --quiet --locked -p skill-analyze -- --help >/dev/null
          cargo run --quiet --locked -p skill-eval -- --help >/dev/null
          cargo run --quiet --locked -p skill-relay -- --help >/dev/null

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build ingest image
        uses: ./.github/actions/build-cached-image
        with:
          dockerfile: containers/ingest.Dockerfile
          tag: skillsissue-ingest:ci
          cache-scope: skillsissue-ingest
      - name: Build sandbox image
        uses: ./.github/actions/build-cached-image
        with:
          dockerfile: containers/sandbox.Dockerfile
          tag: skillsissue-sandbox:ci
          cache-scope: skillsissue-sandbox
      - name: Build relay image
        uses: ./.github/actions/build-cached-image
        with:
          dockerfile: containers/relay.Dockerfile
          tag: skillsissue-relay:ci
          cache-scope: skillsissue-relay
      - name: Build egress interception proxy image
        uses: ./.github/actions/build-cached-image
        with:
          dockerfile: containers/egress-proxy.Dockerfile
          tag: skillsissue-egress-proxy:local
          cache-scope: skillsissue-egress-proxy
      - name: Build detonator image
        uses: ./.github/actions/build-cached-image
        with:
          dockerfile: containers/detonator.Dockerfile
          tag: skillsissue-detonator:ci
          cache-scope: skillsissue-detonator
      - name: Build analyzer image
        uses: ./.github/actions/build-cached-image
        with:
          dockerfile: containers/analyzer.Dockerfile
          tag: skillsissue-analyzer:ci
          cache-scope: skillsissue-analyzer
      - name: Build evaluator image
        uses: ./.github/actions/build-cached-image
        with:
          dockerfile: containers/evaluator.Dockerfile
          tag: skillsissue-evaluator:ci
          cache-scope: skillsissue-evaluator
