name: Detonate skills

on:
  workflow_dispatch:
    inputs:
      limit:
        description: Maximum skills to detonate per shard (1-2)
        required: false
        default: "1"
      shard_count:
        description: Deterministic corpus shards to dispatch (1-16)
        required: false
        default: "4"
      max_parallel:
        description: Maximum disposable eBPF runners used concurrently (1-16)
        required: false
        default: "4"
      agent_adapter:
        description: Intended agent harness
        required: false
        default: codex-cli
        type: choice
        options:
          - codex-cli
          - claude-cli
  schedule:
    # Alternate four daily runs: Codex at 00:00/12:00 UTC, Claude at 06:00/18:00 UTC.
    - cron: "0 0,12 * * *"
    - cron: "0 6,18 * * *"

permissions:
  contents: read

# Matrix legs from one dispatch run concurrently, while separate dispatches do
# not overlap and therefore cannot select the same pending corpus snapshot.
concurrency:
  group: skillsissue-detonation-capture
  cancel-in-progress: false
  queue: max

jobs:
  plan:
    if: >-
      github.event_name != 'workflow_dispatch' ||
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      adapter: ${{ steps.plan.outputs.adapter }}
      aggregate_max_bytes: ${{ steps.plan.outputs.aggregate_max_bytes }}
      aggregate_max_files: ${{ steps.plan.outputs.aggregate_max_files }}
      artifact_prefix: ${{ steps.plan.outputs.artifact_prefix }}
      config: ${{ steps.plan.outputs.config }}
      matrix: ${{ steps.plan.outputs.matrix }}
      max_parallel: ${{ steps.plan.outputs.max_parallel }}
      per_shard_limit: ${{ steps.plan.outputs.per_shard_limit }}
      per_shard_max_bytes: ${{ steps.plan.outputs.per_shard_max_bytes }}
      per_shard_max_files: ${{ steps.plan.outputs.per_shard_max_files }}
      shard_count: ${{ steps.plan.outputs.shard_count }}
      source_sha: ${{ steps.plan.outputs.source_sha }}
    steps:
      # Workflow-level concurrency means this resolves only after the previous
      # dispatch published, avoiding a stale dispatch-time SHA for queued runs.
      - name: Resolve the current default-branch snapshot
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false
      - name: Build a bounded deterministic shard plan
        id: plan
        env:
          LIMIT: ${{ inputs.limit || vars.DETONATION_BATCH_LIMIT || '1' }}
          MAX_PARALLEL: ${{ inputs.max_parallel || vars.DETONATION_MAX_PARALLEL || '' }}
          PUBLICATION_MAX_BYTES: ${{ vars.DETONATION_PUBLICATION_MAX_BYTES || '33554432' }}
          PUBLICATION_MAX_FILES: ${{ vars.DETONATION_PUBLICATION_MAX_FILES || '64' }}
          REQUESTED_ADAPTER: ${{ inputs.agent_adapter || '' }}
          SCHEDULE: ${{ github.event.schedule || '' }}
          SHARD_COUNT: ${{ inputs.shard_count || vars.DETONATION_SHARD_COUNT || '4' }}
        run: |
          if test -z "$MAX_PARALLEL"; then
            MAX_PARALLEL="$SHARD_COUNT"
          fi
          case "$LIMIT:$SHARD_COUNT:$MAX_PARALLEL:$PUBLICATION_MAX_BYTES:$PUBLICATION_MAX_FILES" in
            *[!0-9:]*|:*|*:) exit 1 ;;
          esac
          test "$LIMIT" -ge 1
          test "$LIMIT" -le 2
          test "$SHARD_COUNT" -ge 1
          test "$SHARD_COUNT" -le 16
          test "$MAX_PARALLEL" -ge 1
          test "$MAX_PARALLEL" -le "$SHARD_COUNT"
          # The cap applies independently to each artifact. Keep it bounded so
          # a compromised capture leg cannot turn aggregation into disk abuse.
          test "$PUBLICATION_MAX_BYTES" -ge "$(( LIMIT * 33554432 ))"
          test "$PUBLICATION_MAX_BYTES" -le 268435456
          test "$PUBLICATION_MAX_FILES" -ge 1
          test "$PUBLICATION_MAX_FILES" -le 256

          if test -n "$REQUESTED_ADAPTER"; then
            case "$REQUESTED_ADAPTER" in
              codex-cli|claude-cli) ;;
              *) exit 1 ;;
            esac
            adapter="$REQUESTED_ADAPTER"
          else
            case "$SCHEDULE" in
              "0 0,12 * * *") adapter=codex-cli ;;
              "0 6,18 * * *") adapter=claude-cli ;;
              *) exit 1 ;;
            esac
          fi
          case "$adapter" in
            codex-cli) config=config/detonator-codex.toml ;;
            claude-cli) config=config/detonator-claude.toml ;;
          esac

          matrix='{"include":['
          separator=
          shard_index=0
          while test "$shard_index" -lt "$SHARD_COUNT"; do
            matrix="$matrix$separator{\"shard_index\":$shard_index}"
            separator=,
            shard_index="$(( shard_index + 1 ))"
          done
          matrix="$matrix]}"

          echo "adapter=$adapter" >> "$GITHUB_OUTPUT"
          echo "aggregate_max_bytes=$(( SHARD_COUNT * PUBLICATION_MAX_BYTES ))" >> "$GITHUB_OUTPUT"
          echo "aggregate_max_files=$(( SHARD_COUNT * PUBLICATION_MAX_FILES ))" >> "$GITHUB_OUTPUT"
          echo "artifact_prefix=detonation-$adapter-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          echo "config=$config" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "max_parallel=$MAX_PARALLEL" >> "$GITHUB_OUTPUT"
          echo "per_shard_limit=$LIMIT" >> "$GITHUB_OUTPUT"
          echo "per_shard_max_bytes=$PUBLICATION_MAX_BYTES" >> "$GITHUB_OUTPUT"
          echo "per_shard_max_files=$PUBLICATION_MAX_FILES" >> "$GITHUB_OUTPUT"
          echo "shard_count=$SHARD_COUNT" >> "$GITHUB_OUTPUT"
          echo "source_sha=$(git rev-parse --verify HEAD^{commit})" >> "$GITHUB_OUTPUT"

  capture:
    name: Capture shard ${{ matrix.shard_index }} of ${{ needs.plan.outputs.shard_count }}
    needs: plan
    if: needs.plan.result == 'success'
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.plan.outputs.max_parallel) }}
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    # Every matrix leg must map to a fresh VM with its own local Docker daemon;
    # the VM is destroyed after the leg. Never attach these labels to a shared host.
    runs-on: [self-hosted, linux, x64, ebpf, disposable]
    timeout-minutes: 90
    steps:
      - name: Check out the planner-resolved source and pinned SkillJect
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          submodules: recursive
          persist-credentials: false
      - name: Verify disposable eBPF host and isolated daemon
        run: |
          test -f /sys/kernel/btf/vmlinux
          test -f /sys/fs/cgroup/cgroup.controllers
          test -S /var/run/docker.sock
          test -z "${DOCKER_HOST:-}"
          test ! -e "$HOME/.aws/credentials"
          test ! -e "$HOME/.config/gcloud/application_default_credentials.json"
          test ! -e "$HOME/.kube/config"
          test ! -e "$HOME/.docker/config.json"
          if test -d "$HOME/.ssh"; then
            private_key="$(find "$HOME/.ssh" -maxdepth 1 -type f -name 'id_*' ! -name '*.pub' -print -quit)"
            test -z "$private_key"
          fi
          for name in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN GOOGLE_APPLICATION_CREDENTIALS KUBECONFIG; do
            test -z "${!name:-}"
          done
          docker info >/dev/null
          test -z "$(docker ps --all --quiet)"
      - name: Build trusted supervisor and untrusted target separately
        run: |
          docker build --file containers/sandbox.Dockerfile --tag skillsissue-sandbox:local .
          docker build --file containers/relay.Dockerfile --tag skillsissue-relay:local .
          docker build --file containers/detonator.Dockerfile --tag skillsissue-detonator:local .
      - name: Snapshot typed run index
        run: |
          mkdir -p .baseline/data
          cp data/runs.csv .baseline/data/runs.csv
      - name: Prepare isolated detonation filesystem
        env:
          SHARD_INDEX: ${{ matrix.shard_index }}
        run: |
          worker_root="$RUNNER_TEMP/skillsissue-detonation-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$SHARD_INDEX"
          mkdir -p "$worker_root"
          rsync -a --exclude .git --exclude .baseline --exclude publication --exclude SkillJect --exclude telemetry ./ "$worker_root/"
          mkdir -p "$worker_root/telemetry"
          echo "WORKER_ROOT=$worker_root" >> "$GITHUB_ENV"
      - name: Capture bounded eBPF telemetry with Codex
        id: detonate_codex
        if: needs.plan.outputs.adapter == 'codex-cli'
        continue-on-error: true
        env:
          SKILLSISSUE_PROVIDER_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          test -n "$SKILLSISSUE_PROVIDER_API_KEY"
          docker run --rm \
            --read-only \
            --network none \
            --tmpfs /tmp:rw,nosuid,nodev,size=64m \
            --mount type=bind,src=/var/run/docker.sock,dst=/var/run/docker.sock \
            --mount "type=bind,src=$WORKER_ROOT,dst=$WORKER_ROOT" \
            --mount type=bind,src=/sys/kernel/btf,dst=/sys/kernel/btf,readonly \
            --mount type=bind,src=/sys/fs/cgroup,dst=/sys/fs/cgroup,readonly \
            --env SKILLSISSUE_PROVIDER_API_KEY \
            skillsissue-detonator:local \
            --repo-root "$WORKER_ROOT" \
            --config "${{ needs.plan.outputs.config }}" \
            once \
            --limit "${{ needs.plan.outputs.per_shard_limit }}" \
            --shard-index "${{ matrix.shard_index }}" \
            --shard-count "${{ needs.plan.outputs.shard_count }}"
      - name: Capture bounded eBPF telemetry with Claude
        id: detonate_claude
        if: needs.plan.outputs.adapter == 'claude-cli'
        continue-on-error: true
        env:
          SKILLSISSUE_PROVIDER_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          test -n "$SKILLSISSUE_PROVIDER_API_KEY"
          docker run --rm \
            --read-only \
            --network none \
            --tmpfs /tmp:rw,nosuid,nodev,size=64m \
            --mount type=bind,src=/var/run/docker.sock,dst=/var/run/docker.sock \
            --mount "type=bind,src=$WORKER_ROOT,dst=$WORKER_ROOT" \
            --mount type=bind,src=/sys/kernel/btf,dst=/sys/kernel/btf,readonly \
            --mount type=bind,src=/sys/fs/cgroup,dst=/sys/fs/cgroup,readonly \
            --env SKILLSISSUE_PROVIDER_API_KEY \
            skillsissue-detonator:local \
            --repo-root "$WORKER_ROOT" \
            --config "${{ needs.plan.outputs.config }}" \
            once \
            --limit "${{ needs.plan.outputs.per_shard_limit }}" \
            --shard-index "${{ matrix.shard_index }}" \
            --shard-count "${{ needs.plan.outputs.shard_count }}"
      - name: Stage this shard's capture output
        id: stage
        if: >-
          always() &&
          (steps.detonate_codex.outcome != 'skipped' ||
          steps.detonate_claude.outcome != 'skipped')
        run: |
          mkdir -p publication/data publication/telemetry
          docker run --rm --read-only \
            --user "$(id -u):$(id -g)" \
            --network none \
            --cap-drop ALL \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/source,readonly" \
            --mount "type=bind,src=$WORKER_ROOT,dst=/worker,readonly" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/publication,dst=/publication" \
            --entrypoint skills-state \
            skillsissue-detonator:local \
            diff runs /source/.baseline/data/runs.csv /worker/data/runs.csv /publication/data/runs.csv
          rsync -a --compare-dest="$GITHUB_WORKSPACE/telemetry/" \
            "$WORKER_ROOT/telemetry/" publication/telemetry/
          docker run --rm --read-only \
            --user "$(id -u):$(id -g)" \
            --network none \
            --cap-drop ALL \
            --security-opt no-new-privileges=true \
            --pids-limit 64 \
            --memory 256m \
            --cpus 0.5 \
            --mount "type=bind,src=$GITHUB_WORKSPACE/publication,dst=/publication,readonly" \
            --entrypoint skills-state \
            skillsissue-detonator:local \
            validate-telemetry /publication/data/runs.csv /publication
          docker run --rm --read-only \
            --user "$(id -u):$(id -g)" \
            --network none \
            --cap-drop ALL \
            --security-opt no-new-privileges=true \
            --pids-limit 64 \
            --memory 256m \
            --cpus 0.5 \
            --mount "type=bind,src=$GITHUB_WORKSPACE/publication,dst=/publication,readonly" \
            --entrypoint skills-state \
            skillsissue-detonator:local \
            validate-shard \
            /publication/data/runs.csv \
            "${{ matrix.shard_index }}" \
            "${{ needs.plan.outputs.shard_count }}" \
            "${{ needs.plan.outputs.adapter }}" \
            "${{ needs.plan.outputs.per_shard_limit }}"
          actual_bytes="$(( $(du -sk --apparent-size publication | cut -f1) * 1024 ))"
          actual_files="$(find publication -type f | wc -l | tr -d ' ')"
          test "$actual_bytes" -le "${{ needs.plan.outputs.per_shard_max_bytes }}"
          test "$actual_files" -le "${{ needs.plan.outputs.per_shard_max_files }}"
          echo "artifact_ready=true" >> "$GITHUB_OUTPUT"
          echo "artifact_name=${{ needs.plan.outputs.artifact_prefix }}-shard-${{ matrix.shard_index }}" >> "$GITHUB_OUTPUT"
      - name: Upload this shard without a repository write token
        if: always() && steps.stage.outputs.artifact_ready == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.stage.outputs.artifact_name }}
          path: publication
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Preserve detonation failure after evidence upload
        if: >-
          always() &&
          (steps.detonate_codex.outcome == 'failure' ||
          steps.detonate_claude.outcome == 'failure')
        run: exit 1

  publish:
    needs: [plan, capture]
    # `always()` preserves valid evidence from completed legs when another leg
    # dies before upload. The failed matrix job still makes the workflow fail.
    if: >-
      always() &&
      needs.plan.result == 'success' &&
      (github.event_name != 'workflow_dispatch' ||
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    concurrency:
      group: skillsissue-repo-publisher
      cancel-in-progress: false
      queue: max
    steps:
      - name: Check out clean publisher workspace
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: true
      - name: Download every completed shard separately
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ${{ needs.plan.outputs.artifact_prefix }}-shard-*
          path: ${{ runner.temp }}/skillsissue-detonation-shards-${{ github.run_id }}-${{ github.run_attempt }}
          merge-multiple: false
      - name: Aggregate, validate, and publish completed shards once
        env:
          ADAPTER: ${{ needs.plan.outputs.adapter }}
          AGGREGATE_MAX_BYTES: ${{ needs.plan.outputs.aggregate_max_bytes }}
          AGGREGATE_MAX_FILES: ${{ needs.plan.outputs.aggregate_max_files }}
          ARTIFACT_PREFIX: ${{ needs.plan.outputs.artifact_prefix }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DOWNLOAD_ROOT: ${{ runner.temp }}/skillsissue-detonation-shards-${{ github.run_id }}-${{ github.run_attempt }}
          PER_SHARD_MAX_BYTES: ${{ needs.plan.outputs.per_shard_max_bytes }}
          PER_SHARD_MAX_FILES: ${{ needs.plan.outputs.per_shard_max_files }}
          PER_SHARD_LIMIT: ${{ needs.plan.outputs.per_shard_limit }}
          SHARD_COUNT: ${{ needs.plan.outputs.shard_count }}
        run: |
          test -d "$DOWNLOAD_ROOT"
          unexpected_root_entry="$(find "$DOWNLOAD_ROOT" -mindepth 1 -maxdepth 1 ! -type d -print -quit)"
          test -z "$unexpected_root_entry"
          downloaded_link="$(find "$DOWNLOAD_ROOT" -type l -print -quit)"
          test -z "$downloaded_link"

          declare -A seen_shards=()
          mapfile -d '' shard_roots < <(find "$DOWNLOAD_ROOT" -mindepth 1 -maxdepth 1 -type d -print0 | sort -z)
          test "${#shard_roots[@]}" -ge 1
          test "${#shard_roots[@]}" -le "$SHARD_COUNT"
          for shard_root in "${shard_roots[@]}"; do
            artifact_name="${shard_root##*/}"
            case "$artifact_name" in
              "$ARTIFACT_PREFIX-shard-"*) ;;
              *) exit 1 ;;
            esac
            shard_index="${artifact_name#"$ARTIFACT_PREFIX-shard-"}"
            case "$shard_index" in
              ''|*[!0-9]*) exit 1 ;;
            esac
            test "$shard_index" -lt "$SHARD_COUNT"
            test -z "${seen_shards[$shard_index]+present}"
            seen_shards[$shard_index]=1
            test -f "$shard_root/data/runs.csv"
            unexpected_file="$(find "$shard_root" -type f ! -path "$shard_root/data/runs.csv" ! -path "$shard_root/telemetry/*" -print -quit)"
            test -z "$unexpected_file"
            shard_bytes="$(( $(du -sk --apparent-size "$shard_root" | cut -f1) * 1024 ))"
            shard_files="$(find "$shard_root" -type f | wc -l | tr -d ' ')"
            test "$shard_bytes" -le "$PER_SHARD_MAX_BYTES"
            test "$shard_files" -le "$PER_SHARD_MAX_FILES"
          done

          published=0
          remote_ref="refs/remotes/origin/$DEFAULT_BRANCH"
          for attempt in 1 2 3; do
            worktree="$RUNNER_TEMP/skillsissue-detonation-publisher-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$attempt"
            aggregate="$RUNNER_TEMP/skillsissue-detonation-aggregate-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$attempt"
            merge_state="$RUNNER_TEMP/skillsissue-detonation-merge-state-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$attempt"
            mkdir -p "$aggregate/data" "$aggregate/telemetry" "$merge_state"
            git fetch --no-tags origin "+refs/heads/$DEFAULT_BRANCH:$remote_ref"
            git worktree add --detach "$worktree" "$remote_ref"
            docker build --file "$worktree/containers/detonator.Dockerfile" \
              --tag skillsissue-detonator:publisher "$worktree"

            tracked_link="$(find "$worktree/data" "$worktree/telemetry" -type l -print -quit)"
            test -z "$tracked_link"
            cp "$worktree/data/skills.csv" "$merge_state/skills.csv"
            first_shard=1
            for shard_root in "${shard_roots[@]}"; do
              artifact_name="${shard_root##*/}"
              shard_index="${artifact_name#"$ARTIFACT_PREFIX-shard-"}"
              docker run --rm --read-only --network none --cap-drop ALL \
                --user "$(id -u):$(id -g)" \
                --mount "type=bind,src=$shard_root,dst=/staging,readonly" \
                --entrypoint skills-state skillsissue-detonator:publisher \
                validate-telemetry /staging/data/runs.csv /staging
              docker run --rm --read-only --network none --cap-drop ALL \
                --user "$(id -u):$(id -g)" \
                --mount "type=bind,src=$shard_root,dst=/staging,readonly" \
                --entrypoint skills-state skillsissue-detonator:publisher \
                validate-shard \
                /staging/data/runs.csv \
                "$shard_index" \
                "$SHARD_COUNT" \
                "$ADAPTER" \
                "$PER_SHARD_LIMIT"
              if test "$first_shard" -eq 1; then
                cp "$shard_root/data/runs.csv" "$merge_state/runs.csv"
                first_shard=0
              else
                docker run --rm --read-only --network none --cap-drop ALL \
                  --user "$(id -u):$(id -g)" \
                  --mount "type=bind,src=$merge_state,dst=/data" \
                  --mount "type=bind,src=$shard_root/data,dst=/input,readonly" \
                  --entrypoint skills-state skillsissue-detonator:publisher \
                  merge runs /data/runs.csv /input/runs.csv
              fi
              if test -d "$shard_root/telemetry"; then
                while IFS= read -r -d '' source; do
                  relative="${source#"$shard_root"/telemetry/}"
                  destination="$aggregate/telemetry/$relative"
                  if test -e "$destination"; then
                    cmp -s "$source" "$destination" || exit 1
                  fi
                done < <(find "$shard_root/telemetry" -type f -print0)
                rsync -a --ignore-existing "$shard_root/telemetry/" "$aggregate/telemetry/"
              fi
            done
            cp "$merge_state/runs.csv" "$aggregate/data/runs.csv"

            aggregate_bytes="$(( $(du -sk --apparent-size "$aggregate" | cut -f1) * 1024 ))"
            aggregate_files="$(find "$aggregate" -type f | wc -l | tr -d ' ')"
            test "$aggregate_bytes" -le "$AGGREGATE_MAX_BYTES"
            test "$aggregate_files" -le "$AGGREGATE_MAX_FILES"
            docker run --rm --read-only --network none --cap-drop ALL \
              --user "$(id -u):$(id -g)" \
              --mount "type=bind,src=$aggregate,dst=/aggregate,readonly" \
              --entrypoint skills-state skillsissue-detonator:publisher \
              validate-telemetry /aggregate/data/runs.csv /aggregate

            while IFS= read -r -d '' source; do
              relative="${source#"$aggregate"/telemetry/}"
              destination="$worktree/telemetry/$relative"
              if test -e "$destination"; then
                cmp -s "$source" "$destination" || exit 1
              fi
            done < <(find "$aggregate/telemetry" -type f -print0)
            rsync -a --ignore-existing "$aggregate/telemetry/" "$worktree/telemetry/"
            docker run --rm --read-only --network none --cap-drop ALL \
              --user "$(id -u):$(id -g)" \
              --mount "type=bind,src=$worktree/data,dst=/data" \
              --mount "type=bind,src=$aggregate/data,dst=/input,readonly" \
              --entrypoint skills-state skillsissue-detonator:publisher \
              merge runs /data/runs.csv /input/runs.csv
            git -C "$worktree" add data/runs.csv telemetry/
            if git -C "$worktree" diff --cached --quiet; then
              published=1
              git worktree remove --force "$worktree"
              break
            fi
            git -C "$worktree" \
              -c user.name="skillsissue-bot" \
              -c user.email="skillsissue-bot@users.noreply.github.com" \
              commit -m "telemetry: record sharded skill detonation"
            if git -C "$worktree" push origin "HEAD:refs/heads/$DEFAULT_BRANCH"; then
              published=1
              git worktree remove --force "$worktree"
              break
            fi
            git worktree remove --force "$worktree"
            echo "default branch advanced during publication; retrying ($attempt/3)" >&2
          done
          test "$published" -eq 1
