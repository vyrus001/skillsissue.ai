name: Analyze telemetry

on:
  workflow_dispatch:
    inputs:
      limit:
        description: Maximum pending captures to analyze
        required: false
        default: "100"
  workflow_run:
    workflows: ["Detonate skills"]
    types: [completed]
  schedule:
    - cron: "23 */6 * * *"

permissions:
  contents: read

concurrency:
  group: skillsissue-analysis
  cancel-in-progress: false

jobs:
  replay:
    if: >-
      github.event_name != 'workflow_dispatch' ||
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      artifact_name: ${{ steps.stage.outputs.artifact_name }}
    steps:
      - name: Check out telemetry without a write credential
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Build replay-only analyzer
        run: docker build --file containers/analyzer.Dockerfile --tag skillsissue-analyzer:run .
      - name: Snapshot typed analysis indexes
        run: |
          mkdir -p .baseline/data
          cp data/assessments.csv data/findings.csv data/platform_evidence.csv data/platforms.csv .baseline/data/
      - name: Prepare credential-free replay filesystem
        run: |
          worker_root="$RUNNER_TEMP/skillsissue-analysis-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$worker_root"
          rsync -a --exclude .git --exclude .baseline --exclude publication --exclude corpus --exclude SkillJect ./ "$worker_root/"
          echo "WORKER_ROOT=$worker_root" >> "$GITHUB_ENV"
      - name: Assess captures and discover disabled platform candidates
        env:
          LIMIT: ${{ inputs.limit || '100' }}
        run: |
          docker run --rm --read-only \
            --user "$(id -u):$(id -g)" \
            --network none \
            --cap-drop ALL \
            --security-opt no-new-privileges=true \
            --pids-limit 128 \
            --memory 2g \
            --cpus 2 \
            --tmpfs /tmp:rw,nosuid,nodev,size=128m \
            --mount "type=bind,src=$WORKER_ROOT,dst=/workspace" \
            --workdir /workspace \
            skillsissue-analyzer:run \
            --policy-config config/policy.toml \
            --discovery-config config/discovery.toml \
            once --limit "$LIMIT"
      - name: Stage replay output
        id: stage
        env:
          # The deterministic findings ledger is intentionally published as a
          # complete replacement. Keep enough headroom for a full backlog
          # replay while the compact evidence format rolls through old runs.
          PUBLICATION_MAX_BYTES: ${{ vars.ANALYSIS_PUBLICATION_MAX_BYTES || '268435456' }}
          PUBLICATION_MAX_FILES: ${{ vars.ANALYSIS_PUBLICATION_MAX_FILES || '64' }}
        run: |
          case "$PUBLICATION_MAX_BYTES:$PUBLICATION_MAX_FILES" in
            *[!0-9:]*|:*|*:) exit 1 ;;
          esac
          test "$PUBLICATION_MAX_BYTES" -ge 1
          test "$PUBLICATION_MAX_FILES" -ge 1
          mkdir -p publication/data
          cp \
            "$WORKER_ROOT/data/assessments.csv" \
            "$WORKER_ROOT/data/findings.csv" \
            "$WORKER_ROOT/data/platform_evidence.csv" \
            publication/data/
          docker run --rm --read-only \
            --user "$(id -u):$(id -g)" \
            --network none \
            --cap-drop ALL \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/source,readonly" \
            --mount "type=bind,src=$WORKER_ROOT,dst=/worker,readonly" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/publication,dst=/publication" \
            --entrypoint skills-state \
            skillsissue-analyzer:run \
            diff platforms \
            /source/.baseline/data/platforms.csv \
            /worker/data/platforms.csv \
            /publication/data/platforms.csv
          actual_bytes="$(( $(du -sk --apparent-size publication | cut -f1) * 1024 ))"
          actual_files="$(find publication -type f -print | wc -l | tr -d '[:space:]')"
          test "$actual_bytes" -le "$PUBLICATION_MAX_BYTES"
          test "$actual_files" -le "$PUBLICATION_MAX_FILES"
          echo "artifact_name=analysis-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Upload replay result without repository write access
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.stage.outputs.artifact_name }}
          path: publication
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: replay
    if: >-
      github.event_name != 'workflow_dispatch' ||
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    concurrency:
      group: skillsissue-repo-publisher
      cancel-in-progress: false
      queue: max
    steps:
      - name: Check out clean publisher workspace
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: true
      - name: Download replay result
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.replay.outputs.artifact_name }}
          path: ${{ runner.temp }}/skillsissue-analysis-publication-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Validate and publish assessments against latest
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PUBLICATION_ROOT: ${{ runner.temp }}/skillsissue-analysis-publication-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          test -f "$PUBLICATION_ROOT/data/assessments.csv"
          test -f "$PUBLICATION_ROOT/data/findings.csv"
          test -f "$PUBLICATION_ROOT/data/platform_evidence.csv"
          test -f "$PUBLICATION_ROOT/data/platforms.csv"
          publication_link="$(find "$PUBLICATION_ROOT" -type l -print -quit)"
          test -z "$publication_link"

          published=0
          remote_ref="refs/remotes/origin/$DEFAULT_BRANCH"
          for attempt in 1 2 3; do
            worktree="$RUNNER_TEMP/skillsissue-analysis-publisher-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$attempt"
            git fetch --no-tags origin "+refs/heads/$DEFAULT_BRANCH:$remote_ref"
            git worktree add --detach "$worktree" "$remote_ref"
            docker build --file "$worktree/containers/analyzer.Dockerfile" \
              --tag skillsissue-analyzer:publisher "$worktree"

            tracked_link="$(find "$worktree/data" -type l -print -quit)"
            test -z "$tracked_link"
            docker run --rm --read-only --network none --cap-drop ALL \
              --user "$(id -u):$(id -g)" \
              --mount "type=bind,src=$worktree/data,dst=/data" \
              --mount "type=bind,src=$PUBLICATION_ROOT/data,dst=/input,readonly" \
              --entrypoint skills-state skillsissue-analyzer:publisher \
              replace-analysis /data /input
            docker run --rm --read-only --network none --cap-drop ALL \
              --user "$(id -u):$(id -g)" \
              --mount "type=bind,src=$worktree/data,dst=/data" \
              --mount "type=bind,src=$PUBLICATION_ROOT/data,dst=/input,readonly" \
              --entrypoint skills-state skillsissue-analyzer:publisher \
              merge platforms /data/platforms.csv /input/platforms.csv
            git -C "$worktree" add \
              data/assessments.csv data/findings.csv data/platform_evidence.csv data/platforms.csv
            if git -C "$worktree" diff --cached --quiet; then
              published=1
              git worktree remove --force "$worktree"
              break
            fi
            git -C "$worktree" \
              -c user.name="skillsissue-bot" \
              -c user.email="skillsissue-bot@users.noreply.github.com" \
              commit -m "analysis: assess detonation telemetry"
            if git -C "$worktree" push origin "HEAD:refs/heads/$DEFAULT_BRANCH"; then
              published=1
              git worktree remove --force "$worktree"
              break
            fi
            git worktree remove --force "$worktree"
            echo "default branch advanced during publication; retrying ($attempt/3)" >&2
          done
          test "$published" -eq 1
