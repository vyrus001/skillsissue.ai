name: Build cached image
description: Build and load one local image with a repository-scoped GitHub Actions cache

inputs:
  dockerfile:
    description: Dockerfile path relative to the repository root
    required: true
  tag:
    description: Local image tag loaded into the job's Docker daemon
    required: true
  cache-scope:
    description: Stable GitHub Actions cache scope for this image
    required: true

runs:
  using: composite
  steps:
    - name: Build and load ${{ inputs.tag }}
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      env:
        DOCKER_BUILD_RECORD_UPLOAD: "false"
      with:
        context: .
        file: ${{ inputs.dockerfile }}
        tags: ${{ inputs.tag }}
        load: true
        cache-from: type=gha,scope=${{ inputs.cache-scope }}
        cache-to: type=gha,mode=max,ignore-error=true,scope=${{ inputs.cache-scope }}
