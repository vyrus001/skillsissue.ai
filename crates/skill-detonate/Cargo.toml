[package]
name = "skill-detonate"
version = "0.1.0"
edition = "2024"
license = "PolyForm-Noncommercial-1.0.0"
description = "Isolated agent-skill detonation supervisor and closure-lift harness"
default-run = "skill-detonate"

[lib]
name = "skill_detonate"
path = "src/lib.rs"

[[bin]]
name = "skill-detonate"
path = "src/main.rs"

[[bin]]
name = "skill-harness"
path = "src/bin/skill-harness.rs"

[dependencies]
anyhow = "1.0"
blake3 = "1.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
csv = "1.3"
hex = "0.4"
regex = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
skills-core = { path = "../skills-core" }
tar = "0.4"
tempfile = "3.23"
toml = "0.9"
tokio = { version = "1.47", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
url = "2.5"
walkdir = "2.5"
zeroize = "1.8"
zstd = "0.13"

[dev-dependencies]
assert_fs = "1.1"
