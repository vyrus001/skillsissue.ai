[package]
name = "skill-analyze"
version = "0.1.0"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"
description = "Deterministic Tracee telemetry analyzer for detonated agent skills"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
globset = "0.4"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
skills-core = { path = "../skills-core" }
toml = "0.8"
url = "2.5"
zstd = "0.13"

[dev-dependencies]
tempfile = "3.17"

[[bin]]
name = "skill-analyze"
path = "src/main.rs"
