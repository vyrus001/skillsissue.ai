[package]
name = "skill-relay"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "PolyForm-Noncommercial-1.0.0"
description = "Credential-isolating API relay for skill detonation agent harnesses"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
clap = { version = "4.5", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde_json = "1.0"
tokio = { version = "1.47", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }

[[bin]]
name = "skill-relay"
path = "src/main.rs"
