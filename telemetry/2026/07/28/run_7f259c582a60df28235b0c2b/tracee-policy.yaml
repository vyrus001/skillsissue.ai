    - event: openat
    - event: read
    - event: write
    - event: pipe
    - event: pipe2
    - event: dup
    - event: dup2
    - event: dup3
    - event: close
    - event: renameat
    - event: unlinkat
    - event: chmod
    - event: connect
    - event: security_socket_connect
    - event: net_packet_dns
    - event: dropped_executable
    - event: file_modification
