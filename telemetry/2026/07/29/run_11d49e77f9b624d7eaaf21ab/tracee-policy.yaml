apiVersion: tracee.aquasec.com/v1beta1
kind: Policy
metadata:
  name: skillsissue-detonation
  annotations:
    description: Per-container skill detonation evidence
spec:
  scope:
    - container=34be9d7a0d75cd90b2799af80ae59cec5118b424e9685495d81054f1d9919f74
  rules:
    - event: sched_process_exec
    - event: sched_process_fork
    - event: sched_process_exit
    - event: security_file_open
    - event: openat
    - event: read
    - event: write
    - event: pipe
    - event: pipe2
    - event: dup
    - event: dup2
    - event: dup3
    - event: close
    - event: renameat
    - event: unlinkat
    - event: chmod
    - event: connect
    - event: security_socket_connect
    - event: net_packet_dns
    - event: dropped_executable
    - event: file_modification
